name: reminder_hub
description: "Reminder Hub - Offline Reminder, Account & Household Tracker"
publish_to: 'none'
version: 1.3.1+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  
  # Security
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  flutter_secure_storage: 11.0.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  share_plus: ^13.3.0
  file_picker: ^12.0.0
  url_launcher: ^6.3.0
  collection: ^1.18.0
  crypto: ^3.0.6
  
  # UI Enhancements
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/images/app_icon.png
